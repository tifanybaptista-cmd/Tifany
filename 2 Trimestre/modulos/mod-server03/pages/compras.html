<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras de Roupas</title>
    <!-- Importação de fonte moderna -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <div style="background-color: #1e293b; width: 100%; max-width: 450px; margin: 20px; padding: 32px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2); text-align: center; border: 1px solid #334155;">
        
        <!-- Espaço Reservado para Imagem/Logo da Marca -->
        <div style="width: 80px; height: 80px; background-color: #334155; border-radius: 20px; margin: 0 auto 24px auto; display: flex; align-items: center; justify-content: center; border: 2px dashed #64748b;" title="Espaço para Logo">
            <span style="font-size: 12px; color: #94a3b8; font-weight: 500;">[ LOGO ]</span>
        </div>

        <h3 style="font-size: 28px; font-weight: 700; margin: 0 0 8px 0; color: #ffffff; letter-spacing: -0.5px;">
            <span style="margin-right: 8px;">🛍️</span>Compras
        </h3>
        
        <p style="font-size: 16px; color: #94a3b8; margin: 0 0 32px 0; line-height: 1.5;">
            Bem-vindo(a) à nossa home!
        </p>

        <!-- Container de Links/Botões -->
        <div style="display: flex; flex-direction: column; gap: 16px;">
            
            <!-- Botão Início Home -->
            <a href="/" style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 24px; background-color: #3b82f6; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 15px; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);">
                <!-- Ícone representativo (Início) -->
                <span style="font-size: 18px;">🏠</span>
                Início Home
            </a>

            <!-- Botão Página de Erro -->
            <a href="/erro" style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 24px; background-color: #ef4444; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 15px; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);">
                <!-- Ícone representativo (Erro) -->
                <span style="font-size: 18px;">⚠️</span>
                Página de Erro
            </a>

        </div>

        <!-- Espaço Reservado para Banner ou Vitrine de Roupas -->
        <div style="margin-top: 32px; padding: 20px; background-color: #111827; border-radius: 16px; border: 1px dashed #4b5563; text-align: center;">
            <span style="font-size: 13px; color: #6b7280; font-weight: 500; display: block; margin-bottom: 4px;">[ Espaço para Banner de Roupas ]</span>
            <span style="font-size: 11px; color: #4b5563;">Sugestão: 400x150px</span>
        </div>

    </div>

</body>
</html>
